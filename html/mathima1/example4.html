<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Example 4</title>
  </head>
  <body>
    <form action="">
      <!-- ΣΕ ΠΑΕΙ ΣΕ ΑΛΛΗ ΙΣΤΟΣΕΛΙΔΑ -->
      <label for="fistname">Firstname</label>
      <input type="text" id="fistname" />
      <label for="">File</label>
      <input type="file" multiple />
      <label for="">Image</label>
      <input type="image" />
      <label for="">Date</label>
      <input type="date" />
      <label for="">Weekend</label>
      <input type="week" />
      <label for="">Time</label>
      <input type="time" />
      <label for="password">password</label>
      <input type="password" id="password" aria-describedby="password-help" />
      <p id="password-help">Χρησιμοποιησε τουλαχιστον 8 χαρακτηρες</p>
      <label for="email">Email</label>
      <input type="email" id="email" required />
      <label for="">Select Options</label>
      <select name="" id="">
        <option value="" selected disabled>Επιλογη:</option>
        <option value="">Man</option>
        <option value="">Woman</option>
      </select>
      <label for="">Check: </label>
      Man <input type="checkbox" /> Woman <input type="checkbox" />
      <br />
      <label for="">Radio: </label>
      Man <input type="radio" name="man_or_woman" /> Woman
      <input type="radio" name="man_or_woman" />
      <input type="submit" value="send" />
    </form>
    <p>geia soy polikarpe</p>
  </body>
</html>
