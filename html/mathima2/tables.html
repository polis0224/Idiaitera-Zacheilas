<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tables</title>
    <style>
      table,
      th,
      td {
        border: 1px solid black;
        border-collapse: collapse;
      }
    </style>
  </head>
  <body>
    <table>
      <caption>
        Ο πρωτος μου πινακας
      </caption>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Age</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>Polis</td>
          <td rowspan="2">24</td>
        </tr>
        <tr>
          <td>2</td>
          <td>Marios</td>
        </tr>
        <tr>
          <td>3</td>
          <td colspan="2">Ioannis 33</td>
        </tr>
      </tbody>
    </table>

    <table>
      <caption>
        Ο δευτερος μου πινακας
      </caption>
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Age</th>
      </tr>
      <tr>
        <td>1</td>
        <td>Paul</td>
        <td>35</td>
      </tr>
      <tr>
        <td>1</td>
        <td>Paul</td>
        <td>35</td>
      </tr>
      <tr>
        <td>1</td>
        <td>Paul</td>
        <td>35</td>
      </tr>
      <tr>
        <td>1</td>
        <td>Paul</td>
        <td>35</td>
      </tr>
      <tr>
        <td>1</td>
        <td>Paul</td>
        <td>35</td>
      </tr>
    </table>
  </body>
</html>
