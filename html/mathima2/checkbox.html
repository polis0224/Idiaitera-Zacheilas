<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkbox</title>
  </head>
  <body>
    <label for="gender">Φυλο:</label>
    <select name="gender" id="gender">
      <option value="male">Male</option>
      <option value="female">Female</option>
      <option value="" selected disabled>Select...</option>
    </select>
    <br />
    <label for="">Επιλογη φυλου</label>
    man <input type="checkbox" /> woman <input type="checkbox" />

    <br />
    <label for="">Επιλογη φυλου</label>
    man <input type="radio" name="man_woman" /> woman
    <input type="radio" name="man_woman" />
  </body>
</html>
